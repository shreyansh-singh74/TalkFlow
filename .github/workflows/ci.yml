name: CI

# Two jobs, no matrix: the point is a fast, honest signal on every push, not
# coverage of interpreter versions nobody runs. The backend suite is pure logic
# (no models are loaded: the acoustic tests stub the scorer), so it runs on a
# plain runner without Google credentials or ffmpeg.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # CPU-only torch: the default wheel drags in ~1.2 GB of CUDA libraries
        # that never execute here, and it dominates the job's runtime.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Byte-compile the application
        run: python -m compileall -q app main.py

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  web:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # The progress maths decides what a learner is told to practise, so it is
      # tested without a database. Runs on Node's own test runner via tsx --
      # no test framework added to the dependency tree.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        # A build with no database configured must still compile: every route
        # that touches Postgres does so at request time, not at import time.
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
